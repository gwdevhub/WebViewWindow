name: Windows permission and download tests

on:
  push:
    branches: [ "windows-permission-test", "downloads" ]
  workflow_dispatch:

jobs:
  permissions:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The example is built with MinGW, the same compiler the Windows build uses; the runner has WebView2 already.
      - name: Build the example
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Configure and build
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWEBVIEW_WINDOW_BUILD_EXAMPLE=ON
          cmake --build build

      - name: Run the permission test
        shell: pwsh
        run: ./tests/windows_permission_test.ps1 -BuildDir build

      - name: Run the download test
        shell: pwsh
        run: ./tests/windows_download_test.ps1 -BuildDir build

      - name: Run the click-through test
        shell: pwsh
        run: ./tests/windows_click_through_test.ps1 -BuildDir build
